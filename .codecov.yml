codecov:
  branch: dev
  max_report_age: off

coverage:
  precision: 1
  round: down
  range: "50...100"

  status:
    project:
      default:
        target: auto
        threshold: 2%
        branches: null
        carryforward: true

    patch:
      default:
        target: auto
        threshold: 2%
        branches: null

comment:
  layout: "header, diff, changes, sunburst, uncovered"
  branches: null
  behavior: default