project:
  type: website
website:
  title: kabs
  site-url: https://kabs.poromics.org
  navbar:
    left:
    - href: reference/index.qmd
      text: Reference
    - href: notebooks/index.qmd
      text: Examples
    right:
      - href: https://www.poromics.org
        text: poromics
      - icon: github
        href: https://github.com/PMEAL/kabs
    
metadata-files:
- reference/_sidebar.yml
format:
  html:
    theme:
    - materia
    - custom.scss
    css: styles.css
    toc: true

quartodoc:
  package: kabs
  dynamic: true
  rewrite_all_pages: true
  options:
    include_imports: true
  sidebar: reference/_sidebar.yml
  css: reference/_styles-quartodoc.css
  sections:
    - title: Core Functions
      desc: "Solve flow and compute transport properties"
      contents:
        - solve_flow
        - compute_permeability
        - compute_hydraulic_conductance
        - FlowResult
    - title: Utilities
      desc: "VTR file I/O"
      contents:
        - utils.read_flow_vtr
        - utils.write_flow_vtr
    - title: Visualization
      desc: "Plotting helpers"
      contents:
        - plots.plot_cross_section
        - plots.add_streamlines
        - plots.render_flow