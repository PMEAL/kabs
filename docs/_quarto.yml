project:
  type: website

website:
  title: "kabs"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - reference/index.qmd

metadata-files:
  - reference/_sidebar.yml

format:
  html:
    theme:
      - cosmo
      - brand
    css: styles.css
    toc: true

quartodoc:
  package: kabs
  dynamic: true

  # write sidebar and style data
  sidebar: reference/_sidebar.yml
  css: reference/_styles-quartodoc.css

  sections:
    - title: Core Functions
      desc: "Solve flow and compute transport properties"
      contents:
        - solve_flow
        - compute_permeability
        - compute_hydraulic_conductance
        - FlowResult
    - title: Utilities
      desc: "VTR file I/O"
      contents:
        - utils.read_flow_vtr
        - utils.write_flow_vtr
    - title: Visualization
      desc: "Plotting helpers"
      contents:
        - plots.plot_cross_section
        - plots.add_streamlines
        - plots.render_flow
          